name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The target is a live public demo that is redeployed independently – run nightly to catch drift.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag/title (e.g. @smoke)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BASE_URL: ${{ vars.BASE_URL || 'https://practicesoftwaretesting.com' }}
  API_URL: ${{ vars.API_URL || 'https://api.practicesoftwaretesting.com' }}
  PW_GREP: ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

jobs:
  static-checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API tests need no browser binaries.
      - run: npx playwright test --project=api ${{ env.PW_GREP }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui-tests:
    name: UI + E2E tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The public site sits behind Cloudflare bot protection, which challenges headless browsers on
    # CI runners. Browser tests therefore run against a fresh, seeded, self-hosted instance of the
    # same app (sprint 5), built from the open-source repo at a pinned commit.
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
      TOOLSHOP_REF: ae7caecb811dd8952c09d997e69be7cb946ecd44
    steps:
      - uses: actions/checkout@v5
      - name: Check out Toolshop
        uses: actions/checkout@v5
        with:
          repository: testsmith-io/practice-software-testing
          ref: ${{ env.TOOLSHOP_REF }}
          path: toolshop
      - name: Start Toolshop (Docker)
        run: scripts/start-toolshop.sh toolshop
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --project=chromium --project=e2e ${{ env.PW_GREP }}
      - name: Toolshop logs on failure
        if: failure()
        working-directory: toolshop
        run: docker compose logs --tail 100 laravel-api web
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
